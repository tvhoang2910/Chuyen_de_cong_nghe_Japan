worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 25m;
    underscores_in_headers on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Docker embedded DNS resolver for runtime service discovery.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Keep original proto from upstream proxies (ngrok), fallback to local scheme.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    # ===================== SERVER =====================
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # ===================== STATIC FILES =====================
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # Keep app shell and service worker always fresh after deployments.
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri =404;
        }

        location = /sw.js {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri =404;
        }

        # Proxy browser-safe MinIO requests (rewritten from internal http://minio:9000 URLs).
        # Use ^~ to prevent regex static handlers (e.g. .jpg) from stealing this route.
        location ^~ /minio/ {
            proxy_http_version 1.1;
            proxy_set_header Host minio:9000;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_pass http://minio:9000/;
        }

        # ===================== SPA =====================
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ===================== AUTH =====================
        location /api/v1/auth/ {
            set $auth_upstream http://auth-service:8080;
            proxy_pass $auth_upstream;
        }

        location /api/v1/auth/sse/ {
            set $auth_upstream http://auth-service:8080;
            proxy_pass $auth_upstream;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            add_header X-Accel-Buffering no always;
        }

        # ===================== EXAM =====================
        location /api/v1/exam/ {
            set $exam_upstream http://exam-service:8082;
            proxy_pass $exam_upstream;
        }

        location /api/v1/exam/sse/ {
            set $exam_upstream http://exam-service:8082;
            proxy_pass $exam_upstream;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            add_header X-Accel-Buffering no always;
        }

        # analytics rewrite
        location /api/v1/analytics/ {
            rewrite ^/api/v1/analytics/(.*)$ /api/v1/exam/analytics/$1 break;
            set $exam_upstream http://exam-service:8082;
            proxy_pass $exam_upstream;
        }

        # ===================== STUDY =====================
        location /api/v1/study/ {
            set $study_upstream http://study-service:8085;
            proxy_pass $study_upstream;
        }

        # ===================== COMMUNITY =====================
        location /api/v1/community/ {
            set $community_upstream http://community-service:8084;
            proxy_pass $community_upstream;
        }

        # ===================== SEARCH =====================
        location /api/v1/search/ {
            set $search_upstream http://search-service:8086;
            proxy_pass $search_upstream;
        }

        # ===================== NOTIFICATION =====================
        location /api/v1/notification/ {
            set $notification_upstream http://notification-service:8081;
            proxy_pass $notification_upstream;
        }

        location /api/v1/notifications/ {
            set $notification_upstream http://notification-service:8081;
            proxy_pass $notification_upstream;
        }
    }
}