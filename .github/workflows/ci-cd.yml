name: exam-web ci-cd

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exam-web-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            exam-web/package-lock.json

      - name: Detect project directory
        id: project-dir
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f exam-web/package-lock.json ]; then
            echo "dir=exam-web" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find package-lock.json in root or exam-web/" >&2
            exit 1
          fi

      - name: Install dependencies
        working-directory: ${{ steps.project-dir.outputs.dir }}
        run: npm ci

      - name: Build
        working-directory: ${{ steps.project-dir.outputs.dir }}
        run: npm run build

      - name: Test
        working-directory: ${{ steps.project-dir.outputs.dir }}
        run: npm run test:run
